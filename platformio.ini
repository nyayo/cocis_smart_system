[platformio]
; "standalone" = the whole system on ONE ESP32 (what Wokwi can simulate).
; "entrance" + "room1" + "room2" = the 3-board build for real hardware.
default_envs = standalone

[esp32_base]
platform = espressif32@6.4.0
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3

[env:standalone]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -D TERMINAL_ENTRANCE -D STANDALONE

[env:entrance]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -D TERMINAL_ENTRANCE

[env:room1]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -D TERMINAL_ROOM -D ROOM_ID=1

[env:room2]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -D TERMINAL_ROOM -D ROOM_ID=2
